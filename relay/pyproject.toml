[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-media-relay"
version = "0.1.0"
description = "Bounded opaque WebSocket to TCP relay for browser-owned TLS"
requires-python = ">=3.12"
dependencies = [
  "starlette==0.48.0",
  "uvicorn[standard]==0.35.0",
  "websockets==17.1",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zero_media_relay*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
